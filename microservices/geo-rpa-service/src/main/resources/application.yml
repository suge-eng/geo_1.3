server:
  address: 0.0.0.0
  port: 8084
  connection-timeout: 600s
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
    min-response-size: 1024
  tomcat:
    keep-alive-timeout: 600s
    max-keep-alive-requests: -1
    max-threads: 200
    accept-count: 1000
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      host-header: X-Forwarded-Host
      port-header: X-Forwarded-Port

spring:
  application:
    name: geo-rpa-service
  mvc:
    async:
      request-timeout: 600000

  datasource:
    url: jdbc:mysql://localhost:3307/geo_backend?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: geo
    password: geo123
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6380
      password: "123456"
      timeout: 10s

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  # ===== 邮件 SMTP 配置（卡住通知用）=====
  # 请把下面的 host/port/username/password 改成你自己邮箱的 SMTP 信息。
  # QQ 邮箱：host=smtp.qq.com port=465 username=你的QQ号 password=你的授权码
  # 163邮箱：host=smtp.163.com port=465 username=你的163账号 password=你的授权码
  # 若不想用邮件通知，把 geo.rpa.notify.enabled 改成 false 即可（无需本配置）。
  mail:
    host: smtp.qq.com
    port: 465
    username: 1926491659@qq.com
    password: ydddsogvpcwzeehb
    protocol: smtps
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true
          starttls:
            enable: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      table-underline: true
  mapper-locations: classpath*:mapper/**/*.xml

minio:
  endpoint: http://localhost:9002
  access-key: minioadmin
  secret-key: minioadmin123
  bucket: geo-bucket
  public-endpoint: http://172.27.64.1:9002

logging:
  level:
    com.geo: DEBUG

geo:
  rpa:
    max-retry-count: 10
    request-timeout-ms: 120000
    rate-limit:
      max-requests-per-minute: 60
    worker:
      # 单元认领后的租约时长（秒），worker 心跳续约
      lease-seconds: 1200
      # 清扫器回收租约过期单元
      reclaim-ms: 30000
      reclaim-initial-ms: 10000
    notify:
      # 任务「卡住」邮件通知总开关。false=关闭（不会发任何邮件，也不影响其他功能）
      enabled: true
      # 判卡住阈值（分钟）：RUNNING 超过该时长仍未回调完成，即判定卡住并发邮件
      stuck-minutes: 5
      # 邮件收件人（可多个，逗号分隔）
      to: "1926491659@qq.com"
