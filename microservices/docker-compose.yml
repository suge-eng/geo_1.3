# 数据卷：为各中间件持久化数据，保证容器重建后数据不丢失
volumes:
  geo-mysql-data:
  geo-redis-data:
  geo-rabbitmq-data:
  geo-minio-data:

# 自定义桥接网络：让所有容器处于同一内网，可用容器名（如 geo-mysql）互相访问
networks:
  geo-net:
    driver: bridge
