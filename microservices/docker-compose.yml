services:
  # ======== 基础中间件（4 个容器，保持与原单体一致）========
  # MySQL 8 数据库容器：宿主机 3307 → 容器 3306；
  # 首次启动会用挂载的 schema.sql / init-accounts.sql 自动建库建表。
  mysql:
    image: mysql:8.0
    container_name: geo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: geo_backend
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - geo-mysql-data:/var/lib/mysql
      - ../geo_1.2/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../geo_1.2/src/main/resources/db/init-accounts.sql:/docker-entrypoint-initdb.d/02-accounts.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - geo-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Redis 缓存容器：开启密码(123456)与 AOF 持久化，宿主机 6380 → 容器 6379。
  redis:
    image: redis:7-alpine
    container_name: geo-redis
    command: redis-server --requirepass 123456 --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - geo-redis-data:/data
    networks:
      - geo-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # RabbitMQ 消息队列容器（management 含 Web 管理台）：宿主机 5673→5672(AMQP)、15673→15672(管理台)。
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: geo-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - geo-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - geo-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # MinIO 对象存储容器：宿主机 9002→9000(API)、9001→9001(控制台)，账号 minioadmin。
  minio:
    image: minio/minio:latest
    container_name: geo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - geo-minio-data:/data
    networks:
      - geo-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

